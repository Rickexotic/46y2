<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
        }

        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.3rem;
            max-width: 700px;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Welcome to Our Website</h1>
        <p>
            We help businesses innovate, grow, and succeed with modern solutions,
            strategic thinking, and exceptional service.
        </p>
        <a href="#about" class="btn">Get Started</a>
    </section>

    <footer>
        © 2026 All Rights Reserved
    </footer>

</body>
</html>
